<!DOCTYPE html>
<html lang="ko-KR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>CSS 상태 가상요소 연습</title>
    <link rel="stylesheet" href="./style/selector3.css"/>
</head>
<body>
    <!-- 마우스 오버 -->
    <a href="#" class="course-link">강의 보기</a>

    <hr/>

    <!-- 키보드 포커스 -->
     <button type="button" class="apply-button">수강 신청</button>

     <hr/>

     <!-- 체크 상태 -->
     <label for="agree">
        <input type="checkbox" name="" id="agree"/>이용약관 동의
     </label>

     <hr/>
     
    <!-- 비활성 단계 -->
     <button disabled>다음 단계</button>

     <!-- 가상 요소 -->
     <p class="notice">수업이 곧 시작됩니다.</p>
     <a href="#" class="external">MDN 바로가기</a>
</body>
</html>
