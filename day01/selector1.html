<!DOCTYPE html>
<html lang="ko-KR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>CSS 선택자 연습</title>
    <link rel="stylesheet" href="./style/selector1.css"/>
</head>
<body>
    
    <header>
        <h1>CSS 선택자 연습</h1>
        <hr/>
        <p>HTML을 보고 알맞은 선택자를 작성해 배경색을 적용하세요.</p>
    </header>

    <main>
        <section aria-label="question1">
            <h1>태그 선택자</h1>
        </section>
        <section aria-label="question2">
            <div class="box">클래스 선택자</div>
        </section>
        <section aria-label="question3">
            <div id="box">아이디 선택자</div>
        </section>
        <section aria-label="question4">
            <div class="color-box">
                <a href="#">선택자 조합</a>
            </div>
        </section>
        <section aria-label="question5">
            <ul id="color-list">
                <li>선택자 조합01</li>
                <li class="point">선택자 조합02</li>
                <li>선택자 조합03</li>
            </ul>
        </section>
    </main>
</body>
</html>
