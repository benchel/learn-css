    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

      type="image/x-icon"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"

      crossorigin="anonymous"

    <style>
      body {
        height: 30000px;
      }
      .custom-card {
        border: 2px solid red;
      }
    </style>

  <body>
    <nav class="fixed-top navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <img
          src="https://getbootstrap.kr/docs/5.3/assets/brand/bootstrap-logo.svg"
          alt="Bootstrap"
          width="30"
          height="24"
        />
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"

          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Link</a>
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Dropdown
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Action</a></li>
                <li><a class="dropdown-item" href="#">Another action</a></li>
                <li><hr class="dropdown-divider" /></li>
                <li>
                  <a class="dropdown-item" href="#">Something else here</a>
                </li>
              </ul>
            </li>
            <li class="nav-item">
              <a class="nav-link disabled" aria-disabled="true">Disabled</a>
            </li>
          </ul>
          <form class="d-flex" role="search">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Search"
              aria-label="Search"
            />
            <button class="btn btn-outline-success" type="submit">
              Search
            </button>
          </form>
        </div>
      </div>
    </nav>

    <div class="container">
      <div class="row">
        <div class="col-12 col-md-6">Column</div>
        <div class="col-12 col-md-6">Column</div>
      </div>
    </div>
    <div class="d-none d-md-block">hello</div>

    <div class="card">
      <img
        src="https://i.namu.wiki/i/ReQ7sv1_v4S-Oqewy2xkm6BYFosd1UbG9z37EeQPv5XR-qgsrhvKsqT6kEqidctSj-S3ycgJYjd1XkzUhNFCfQ.webp"
        alt=""
      />
      <div class="card-body">
        <h5 class="card-title">Frontend Course</h5>
        <p class="card-text">HTML과 CSS를 학습합니다.</p>
        <a href="#" class="btn btn-primary">자세히 보기</a>
      </div>
    </div>

    <hr />

    <div
      class="card w-50 m-auto custom-card fs-3 bg-body text-body rounded d-flex justify-content-around align-baseline p-4"
    >
      <div class="card-body">
        <h5 class="card-title mb-4 text-primary fw-bold">로그인</h5>
        <hr />
        <div>
          <label class="form-label" for="email">이메일</label>
          <input class="form-control" id="email" />
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">password</label>
          <input class="form-control" id="password" type="password" />
        </div>
        <button type="button" class="btn btn-primary w-100">login</button>
      </div>
    </div>

    <div class="container p-5">
      <button
        type="button"
        class="btn btn-primary"
        data-bs-toggle="collapse"
        data-bs-target=".info,.info2"
      >
        강의 정보 보기
      </button>
    </div>

    <div class="collapse mt-3 info" id="info">
      <div class="card card-body">
        HTML, CSS, Bootstrap을 활용하여 반응형 웹 페이지를 제작합니다.
      </div>
    </div>

    <h2 class="info">hello</h2>

    <h2 class="info2">hello world</h2>

    <hr />

    <button
      type="button"
      class="btn btn-primary"
      data-bs-toggle="modal"
      data-bs-target="#courseModal"
    >
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-bar-left" viewBox="0 0 16 16">
      <path fill-rule="evenodd" d="M12.5 15a.5.5 0 0 1-.5-.5v-13a.5.5 0 0 1 1 0v13a.5.5 0 0 1-.5.5M10 8a.5.5 0 0 1-.5.5H3.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L3.707 7.5H9.5a.5.5 0 0 1 .5.5"/>
    </svg>    
      강의 정보
    </button>

    <div class="modal fade" id="courseModal">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title">강의 정보</h2>
            <button 
              type="button" 
              class="btn-close" 
              data-bs-dismiss="modal" 
              aria-label="닫기"
            >
            </button>
          </div>

          <div class="modal-body">HTML, CSS, Bootstrap을 배울 수 있는 강의입니다.</div>
        </div>
      </div>
    </div>
