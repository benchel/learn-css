<!DOCTYPE html>
<html lang="ko-KR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>부트스트랩 실습2</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"/>
</head>
<body>
    
    <main class="container py-5">
        <section class="bg-white border rounded-4 p-md-4">
            <div class="row">
                <div class="col-8">
                    <span class="badge text-bg-success mb-3">신청가능</span>
                    <span class="">Frontend Study #03</span>
                    <h1 class="fw-bold mb-sm-31">bootstrap 실전 스터디</h1>
                    <p class="text-secondary mb-2">Bootstrap의 Grid, Utillity, Component를 활용해 반응형 웹 UI를 함께 제작하는 오프라인 스터디입니다.</p>
                    <div class="row mb-0 m-sm-0">
                        <div class="row justify-content-between border-bottom border-top">
                            <div class="col-4 mt-3">
                                <span>일정</span>
                            </div>
                            <div class="col-8 mt-3">
                                <p class="fw-bold text-end">9월 12일 토요일 14:00</p>
                            </div>
                        </div> 
                        <div class="row justify-content-between border-bottom">
                            <div class="col-4 mt-3">
                                <span>장소</span>
                            </div>
                            <div class="col-8 mt-3">
                                <p class="fw-bold text-end">강남 스터디룸 A</p>
                            </div>
                        </div> 
                        <div class="row justify-content-between border-bottom">
                            <div class="col-4 mt-3">
                                <span>진행 시간</span>
                            </div>
                            <div class="col-8 mt-3">
                                <p class="fw-bold text-end">약 2시간</p>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12 d-flex flex-wrap gap-2 pt-4 justify-content-start">
                            <span class="badge rounded-pill text-bg-light border px-3 py-2">CSS</span>
                            <span class="badge rounded-pill text-bg-light border px-3 py-2">Utility</span>
                            <span class="badge rounded-pill text-bg-light border px-3 py-2">Responsive</span>
                        </div>
                    </div>
                </div>
                <div class="col-4">
                    <div class="bg-light p-4 p-md-5 rounded-4">
                        <div class="row col-12 mb-2">
                            <span>현재 신청 인원</span>
                        </div>
                        <div class="row justify-content-between position-relative">
                            <div class="col-8">
                                <h1 class="fw-bold">18명</h1>
                            </div>
                            <div class="col-4">
                                <span class="text-end position-absolute bottom-0 end-0">/24명</span>
                            </div>
                        </div>
                        <div class="row mt-2 mb-2"> 
                            <div class="progress pe-0 ps-lg-0 mb-1" role="progressbar" aria-label="Basic example" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">
                                <div class="progress-bar" style="width: 75%">75%</div>
                            </div>
                        </div>
                        <div class="row">
                            <p class="bg-warning-subtle border border-warning rounded-2 p-lg-3">남은 자리가 많지 않습니다.</p>                          
                        </div>
                        <div class="row">
                            <a href="#" class="text-decoration-none bg-black text-light rounded-2 text-center p-lg-2">스터디 참가 신청</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>




</body>
</html>
